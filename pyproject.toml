[project]
name = "strainy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Diener", email = "mail [at] cdiener.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cobra>=0.32.1",
    "memote>=0.17.0",
    "micom>=0.39.1",
    "pyrodigal>=3.7.1",
    "requests>=2.32.0",
    "rich>=13.0.0",
    "seaborn>=0.13.2",
]

[project.scripts]
bootstrap = "strainy.bootstrap:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["data/**"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.93",
]
